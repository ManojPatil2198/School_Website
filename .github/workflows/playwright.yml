name: Playwright Tests

on:
    push:
        branches:
            - main
            - develop

    pull_request:
        branches:
            - main
            - develop

    workflow_dispatch:

permissions:
    contents: read
    checks: write

jobs:
    test:
        name: Quality Checks & E2E Tests
        timeout-minutes: 60
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers & dependencies
              run: npx playwright install --with-deps chromium

            - name: Run ESLint
              run: npm run lint

            - name: Check code formatting
              run: npm run format:check

            - name: Run TypeScript type checking
              run: npm run typecheck

            - name: Run Playwright tests
              run: npm test
              env:
                  CI: true
                  BASE_URL: ${{ secrets.BASE_URL || 'https://united-school-tokyo.wixsite.com/united-school-of-tok/home' }}

            - name: Upload Playwright HTML Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30

            - name: Upload Test Results & Failure Artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 30
